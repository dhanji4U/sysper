name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check (typecheck, lint, format)
        run: pnpm check

      - name: Run tests (vitest)
        run: pnpm test

  e2e:
    name: E2E & Visual (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Generate Visual Summary
        if: always()
        run: |
          echo "### Playwright E2E & Visual Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Type | Path |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          find test-results -type f \( -name "*.png" -o -name "*.webm" \) | sort | while read -r file; do
            echo "| \`$(basename "$file")\` | \`$file\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload visual artifacts (videos & screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-and-screenshots
          path: test-results/
          retention-days: 14

      - name: Publish screenshots to preview branch
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_DIR=$(mktemp -d)
          git clone --depth 1 --branch preview-snapshots "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$TARGET_DIR" 2>/dev/null || {
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git checkout --orphan preview-snapshots
          }
          cd "$TARGET_DIR"
          mkdir -p "pr-${PR_NUMBER}"
          cp "$GITHUB_WORKSPACE"/test-results/screenshots/*.png "pr-${PR_NUMBER}/"
          git add "pr-${PR_NUMBER}"
          git commit -m "chore(ci): visual snapshot for PR #${PR_NUMBER} [skip ci]" || echo "No changes to commit"
          git push origin preview-snapshots

      - name: Post E2E & Visual Summary to Pull Request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          RAW_BASE="https://raw.githubusercontent.com/${REPO}/preview-snapshots/pr-${PR_NUMBER}"
          COMMENT_BODY=$(cat <<EOF
          ### Playwright E2E & Visual Verification

          | Test Scenario | Status |
          | --- | --- |
          | Initial welcome view & branding | Passed |
          | Tab navigation & dark mode toggle | Passed |
          | Folder scan & categorized results list | Passed |
          | Directory inspection via file manager | Passed |
          | Live search filter & empty state | Passed |
          | Clean confirmation modal to success page | Passed |

          ### Visual Screen Previews

          <details open>
          <summary><b>Welcome Screen</b></summary>

          <img src="${RAW_BASE}/welcome.png" width="700" alt="Welcome Screen" />
          </details>

          <details open>
          <summary><b>Results List</b></summary>

          <img src="${RAW_BASE}/results-list.png" width="700" alt="Results List" />
          </details>

          <details>
          <summary><b>Live Search Filter (alpha)</b></summary>

          <img src="${RAW_BASE}/search-filtered.png" width="700" alt="Search Filtered" />
          </details>

          <details>
          <summary><b>Live Search Empty State</b></summary>

          <img src="${RAW_BASE}/search-empty.png" width="700" alt="Search Empty" />
          </details>

          <details>
          <summary><b>Clean Confirmation Modal</b></summary>

          <img src="${RAW_BASE}/confirm-modal.png" width="700" alt="Confirm Modal" />
          </details>

          <details>
          <summary><b>Success Screen (Freed & Confetti)</b></summary>

          <img src="${RAW_BASE}/success-page.png" width="700" alt="Success Page" />
          </details>

          <details>
          <summary><b>Dark Mode Settings</b></summary>

          <img src="${RAW_BASE}/settings-dark.png" width="700" alt="Dark Mode Settings" />
          </details>

          <br />

          **Video Recordings & Artifacts**: Full .webm video recordings of all test journeys are available in the CI run artifacts:
          [Download Playwright Videos & Screenshots](https://github.com/${REPO}/actions/runs/${{ github.run_id }})
          *(Retention: 14 days)*
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"

  backend:
    name: Backend (cargo check & test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
