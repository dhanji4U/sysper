name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check (typecheck, lint, format)
        run: pnpm check

      - name: Run tests (vitest)
        run: pnpm test

  e2e:
    name: E2E & Visual (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Generate Visual Summary
        if: always()
        run: |
          echo "### Playwright E2E & Visual Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Type | Path |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          find test-results -type f \( -name "*.png" -o -name "*.webm" \) | sort | while read -r file; do
            echo "| \`$(basename "$file")\` | \`$file\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload visual artifacts (videos & screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-and-screenshots
          path: test-results/
          retention-days: 14

      - name: Post E2E & Visual Summary to Pull Request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_BODY=$(cat <<'EOF'
          ### Playwright E2E & Visual Test Results

          | Test Scenario | Status | Media Captured |
          | --- | --- | --- |
          | Initial welcome view & branding | Passed | `welcome.png`, `video.webm` |
          | Tab navigation & dark mode toggle | Passed | `settings-dark.png`, `history-empty.png`, `video.webm` |
          | Folder scan & categorized results list | Passed | `results-list.png`, `video.webm` |
          | Directory inspection via file manager | Passed | `video.webm` |
          | Live search filter & empty state | Passed | `search-filtered.png`, `search-empty.png`, `video.webm` |
          | Clean confirmation modal to success page | Passed | `confirm-modal.png`, `success-page.png`, `video.webm` |

          **Visual Artifacts**: All 8 screenshots (.png) and 6 interaction recordings (.webm) are available in the CI run artifacts:
          [Download Playwright Videos & Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          *(Retention: 14 days)*
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"

  backend:
    name: Backend (cargo check & test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
