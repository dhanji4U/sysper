# Build unsigned Windows / Linux / macOS installers and attach them to a
# GitHub Release (draft). Signing stays off until cert secrets exist.
#
# Later (do not set these until you have certs):
#   Windows OV:     WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#                   then tauri.conf.json bundle.windows.certificateThumbprint
#   Apple notarize: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Trigger: Actions → Release → Run workflow
#      or: git tag v1.0.0 && git push origin v1.0.0

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune-old-releases:
    name: Prune older releases (stay under 0.5 GB quota)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          if [ -z "$TARGET_TAG" ]; then
            VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            TARGET_TAG="v$VERSION"
          fi
          echo "Target release tag: $TARGET_TAG"

          gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name != "'"$TARGET_TAG"'") | .id' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Pruning older release ID: $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            fi
          done

  publish-tauri:
    needs: prune-old-releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # No-op until WINDOWS_CERTIFICATE is added as a repo secret.
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "emiote-sysper.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When certs exist, uncomment and add the matching repo secrets:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Emiote Sysper v__VERSION__
          releaseBody: |
            Unsigned build (no publisher cert yet).

            **Windows:** SmartScreen may warn — More info → Run anyway.
            **macOS:** Right-click → Open, or `xattr -cr /Applications/Emiote\ Sysper.app`

            Moves junk to Trash only. Never permanently deletes.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
